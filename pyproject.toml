[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-gateway"
version = "0.1.0"
description = "Free-tier multi-provider LLM gateway with one OpenAI-shaped API"
requires-python = "==3.12.*"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "python-jose[cryptography]>=3.3",
    "redis>=5.2",
    "pyyaml>=6.0",
    # Phase 3 Step 1. `ZoneInfo("America/Los_Angeles")` needs a timezone database,
    # and neither Windows nor a `python:*-slim` container is guaranteed to ship
    # one — a runtime dependency, not a dev one, because `quota/windows.py`'s
    # `fixed_daily_pt` resolves it on every request, not just in tests.
    "tzdata>=2025.1",
    # Phase 4 Step 1. FastAPI cannot parse a multipart body without this — the
    # failure is an assertion at *route definition* time, not request time
    # (trap 1), so it has to be installed before `POST /v1/files` is even
    # importable.
    "python-multipart>=0.0.18",
    # PDF text layer + rasterization for the local tier (D30). AGPL-3.0 — fine
    # for a project that is not distributed as a closed-source product; see
    # docs/limitations.md. `pypdfium2` (BSD) is the documented swap.
    "pymupdf>=1.24",
    # Tesseract OCR bindings for the local tier's image/scanned-PDF path.
    # Shells out to the `tesseract` binary (Dockerfile), which is absent on a
    # developer's machine unless installed separately — detected at startup,
    # never assumed (D30).
    "pytesseract>=0.3.13",
    # pytesseract's image handle.
    "pillow>=11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    # Phase 2 Step 3's circuit breaker. `redis>=5.2` is already a runtime dep and
    # goes unused until Step 2; this is what lets the breaker's state machine be
    # tested without a running server. Deliberately no `tenacity`: Step 4's
    # same-provider retries are hand-rolled, because a decorator fights the
    # async-generator streaming path in Step 9.
    #
    # The [lua] extra pulls in `lupa`, without which fakeredis raises on EVAL and
    # the script-loading path in app/cache/client.py could only be tested against
    # a real server — which CI deliberately does not run.
    "fakeredis[lua]>=2.26",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --------------------------------------------------------------------------- #
# ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "ASYNC",
    "RUF",
]
ignore = [
    "B008",  # FastAPI's Depends(...) in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# N818 wants every exception named `*Error`. Contract A (§2.1.2) freezes the
# provider hierarchy as RateLimited / Unavailable / BadRequest / ContextTooLong /
# ContentFiltered / EmptyResponse, and the app-level hierarchy mirrors that
# naming so the two read alike. The contract outranks the convention.
"app/core/errors.py" = ["N818"]
"app/providers/errors.py" = ["N818"]
# `UnknownSlot` names the fact, matching `InvariantViolation` and the provider
# hierarchy above it. An `Error` suffix here and nowhere else nearby would read
# as a distinction that does not exist.
"app/providers/registry.py" = ["N818"]
# ASYNC109 wants `asyncio.timeout` instead of a `timeout` parameter. Two reasons
# it does not apply. The signature is frozen by Contract A §2.1.3, and the value
# is not a wall-clock deadline — it becomes httpx's *read* timeout, leaving
# connect, write and pool at their own limits. `asyncio.timeout` would collapse
# that into one number and cancel a request that was streaming along fine.
"app/providers/base.py" = ["ASYNC109"]
"app/providers/groq.py" = ["ASYNC109"]
"app/providers/gemini.py" = ["ASYNC109"]
"app/providers/openrouter.py" = ["ASYNC109"]
# `RoutingFailed` is the outcome, named as one — and deliberately not a
# `ProviderError`, so an `Error` suffix would make it read as a sibling of the
# frozen hierarchy above rather than the wrapper it is.
"app/routing/router.py" = ["N818"]
# `InvariantViolation` names the thing that happened — a Contract B invariant
# (§2.2.3) was violated. `InvariantViolationError` reads as "an error about a
# violation", one noun further from the fact. The contract's vocabulary wins.
"app/memory/canonical.py" = ["N818"]

[tool.ruff.lint.isort]
# `src` alone does not make these first-party — ruff resolves it by looking for
# an `app/` inside each src root. Naming them keeps app and test imports in their
# own block instead of scattered through the third-party one.
known-first-party = ["app", "tests", "scripts"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------- #
# mypy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
show_error_codes = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["jose.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "contract: adapter conformance suite",
    "integration: exercises the app end-to-end against local services",
]

# --------------------------------------------------------------------------- #
# coverage
# --------------------------------------------------------------------------- #
# Deliberately *not* wired into `addopts`. Measuring on every run slows the suite
# down for no benefit, and a `--cov-fail-under` gate turns "this refactor moved a
# branch" into a red build on work that had nothing to do with it. `make coverage`
# asks the question when someone wants the answer.
[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/*/__init__.py", "app/__init__.py"]
# SQLAlchemy's asyncio bridge runs every statement through `greenlet_spawn`.
# Without this, the tracer loses the frame across a greenlet switch and reports
# everything *after* an `await session.execute(...)` as unexecuted — code that
# demonstrably runs, since the tests asserting on its effects pass.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    # Import-time only; never executed at runtime.
    "if TYPE_CHECKING:",
    # Protocol and overload bodies — there is nothing there to run.
    "^\\s*\\.\\.\\.$",
    # Phase 2+ seams. The hard rule is that they raise rather than pass silently;
    # counting them as uncovered would push the number down for doing that right.
    "raise NotImplementedError",
]
