## lint -> typecheck -> test -> deploy, per Step 11.
##
## `lint` and `test` are separate jobs rather than sequential steps in one: a
## formatting nit should report in well under a minute instead of queueing behind
## a database container, and the two are genuinely independent.
##
## Nothing here ever calls a live provider. Every upstream HTTP call in the suite
## goes through `httpx.MockTransport`, every provider key below is a fake, and
## `scripts/record_fixtures.py` — the only thing in the repo that talks to Groq —
## is never invoked.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to a PR should cancel the first run rather than race it. Not on
# main: those runs deploy, and cancelling a deploy halfway is worse than waiting.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - name: ruff (lint)
        run: ruff check app tests scripts

      - name: ruff (format)
        run: ruff format --check app tests scripts

      # `files` in pyproject covers app, tests and scripts, so the test suite is
      # type-checked under strict mode too — which is the point of having it.
      - name: mypy
        run: mypy

  test:
    name: pytest
    runs-on: ubuntu-latest

    # The suite needs a real Postgres. The schema uses JSONB, a partial unique
    # index, gen_random_uuid() and timestamptz, and the bugs worth catching are
    # exactly the ones a SQLite stand-in could not catch. conftest creates and
    # drops `gateway_test` itself, from the `postgres` maintenance database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Only DATABASE_URL is strictly required — tests/conftest.py `setdefault`s
      # the rest. They are all set explicitly anyway: a CI run that depends on a
      # default living in a test file is a CI run that breaks when someone edits
      # that file for an unrelated reason.
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@127.0.0.1:5432/gateway
      REDIS_URL: redis://localhost:6379/0
      ENV: test
      SUPABASE_URL: https://test-project.supabase.co
      SUPABASE_JWT_AUDIENCE: authenticated
      REQUIRE_VERIFIED_EMAIL: "true"
      GROQ_API_KEY: gsk_test_key_not_real
      GEMINI_API_KEY: gemini_test_key_not_real
      OPENROUTER_API_KEY: sk-or-v1-test-key-not-real
      # A real Fernet key — Phase 6 Step 2's boot validation constructs a
      # `Fernet` from this and round-trips a probe value, unlike the
      # placeholder-shaped values above.
      ENCRYPTION_KEY: iq1hoAgg3prhNnvkakmnNqeU4cn51aLAF9LvKxe6ydU=
      # Phase 4 Step 1: FILES_STORAGE_BACKEND defaults to "supabase", which a
      # boot-time validator refuses without this set.
      SUPABASE_SERVICE_ROLE_KEY: service_role_test_key_not_real

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      # One run, with coverage attached. Locally `make test` and `make coverage`
      # are separate so the common case stays fast; in CI the suite is going to
      # run anyway, so measuring costs nothing extra and running it twice costs
      # a full second pass.
      #
      # Coverage is reported, never gated. A --cov-fail-under threshold would
      # fail unrelated work whenever a branch moved.
      - name: pytest + coverage
        run: pytest --cov --cov-report=term-missing

  frontend:
    name: frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Deliberately no `npm run build`. It needs real NEXT_PUBLIC_SUPABASE_*
      # values, and Vercel already builds on every push — running it here buys a
      # second way to fail, not a second signal.

  deploy:
    name: deploy to render
    needs: [lint, test, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # One deploy at a time, and never cancelled mid-flight.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # The image builds on Render, from the repo it is already connected to, so
      # this job checks nothing out and needs no Docker daemon — it only says
      # "now". Render's own auto-deploy is off (render.yaml's `autoDeploy: false`)
      # precisely so this is the only thing that can trigger one, which is what
      # puts `needs:` above in front of every deploy.
      #
      # `ref` pins the build to the commit this run actually tested, rather than
      # whatever `main` happens to point at by the time Render picks the job up.
      # It is a **query parameter** on the hook URL, which is the only place
      # Render reads it from — the first spelling of this step sent it as a form
      # body (`-d "ref=..."`), which Render ignores entirely, so every deploy
      # silently built the branch head while this comment claimed otherwise.
      # The hook URL already carries `?key=`, but the separator is computed
      # rather than assumed so a hook without a query string still composes.
      #
      # Deliberately not `curl -f`. `-f` does buy the one thing that matters —
      # a rejected hook has to fail the job rather than print an error body and
      # exit 0 — but it buys it by collapsing every answer Render can give into
      # the same `curl: (22) ... error: 500` and discarding the body with it.
      # Run #25 was a Render-side 500 and reported in exactly as much detail as
      # a revoked key would have. So: no `-f`, read `%{http_code}` instead, and
      # say what each status means. Same reasoning as the two guards below,
      # applied to the half of the failure space that is on Render's side.
      #
      # Render's documented answers are 200 (queued), 202 (queued behind a
      # running deploy), 400 (bad `ref`), 401 (bad `key`), 404 (no such service
      # *or* no such commit), 405 (wrong method) and 409 (service suspended, or
      # the workspace may not deploy — what running out of free instance hours
      # looks like). 5xx is undocumented, means Render broke rather than that
      # anything here is wrong, and is therefore the one class worth retrying:
      # three attempts, 15s then 30s apart. Failing after that is deliberate —
      # nothing shipped, and a green job that deployed nothing is the exact
      # failure `-f` was there to prevent.
      #
      # The two guards in front of the curl exist because curl's own failure for
      # a bad secret is unreadable, and worse, ambiguous. A missing secret
      # expands to an empty string, and the runner's curl (8.5 on ubuntu-24.04)
      # hands that to the URL parser and exits 3, "URL rejected: Malformed input
      # to a URL function" — the same exit a genuinely malformed URL gets, and
      # the error names no secret because a secret stays masked inside the error
      # that quotes it. Run #18 of this workflow was the missing-secret case and
      # read as the malformed-URL one. (curl >= 8.6 splits them, rejecting the
      # blank argument with exit 2 before it reaches the parser — so debugging
      # this against a local curl gives the wrong answer; docs/deploy.md 6.3 has
      # the table.) Hence: check the value here rather than inferring it from an
      # exit code, strip whitespace so a URL pasted with a trailing newline still
      # works, and name the secret in the failure. Nothing echoes the value.
      #
      # This returns as soon as Render *queues* the deploy. A green job here means
      # "Render accepted it", not "it shipped" — the build, the `alembic upgrade
      # head` in render.yaml's dockerCommand, and the health check all happen
      # afterwards, and the Render dashboard is where they report.
      - name: trigger render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          hook="$(printf '%s' "$RENDER_DEPLOY_HOOK_URL" | tr -d '[:space:]')"

          if [ -z "$hook" ]; then
            echo "::error::The RENDER_DEPLOY_HOOK_URL repository secret is empty or not set. Settings -> Secrets and variables -> Actions; the value is the whole https://api.render.com/deploy/srv-<id>?key=<secret> URL from the Render service's Settings -> Deploy Hook. See docs/deploy.md section 6.3."
            exit 1
          fi

          case "$hook" in
            https://api.render.com/deploy/srv-*) ;;
            *)
              echo "::error::The RENDER_DEPLOY_HOOK_URL secret is set but is not a Render deploy hook URL (it must start with https://api.render.com/deploy/srv-). Re-copy it from the Render service's Settings -> Deploy Hook. See docs/deploy.md section 6.3."
              exit 1
              ;;
          esac

          case "$hook" in
            *\?*) separator='&' ;;
            *)    separator='?' ;;
          esac

          attempt=1
          while : ; do
            # Truncated first: curl leaves the file untouched when the
            # request never completes, and reporting the previous attempt's
            # body under this attempt's status would be a lie.
            : > response.body
            status="$(curl -sS -o response.body -w '%{http_code}'               -X POST "${hook}${separator}ref=${COMMIT_SHA}")" || status="000"

            # Render's body, not ours, and the hook URL is a credential — scrub
            # any `key=` it quotes back before it reaches a log that outlives
            # this run. Truncated because a 5xx page is an HTML document.
            body="$(head -c 400 response.body 2>/dev/null | sed 's/key=[^&]*/key=***/g')"

            case "$status" in
              200|202)
                echo "Render queued a deploy of ${COMMIT_SHA} (HTTP $status)."
                echo "$body"
                exit 0
                ;;
              401)
                echo "::error::Render rejected the deploy hook's key (HTTP 401). The secret is a well-formed hook URL but its key is wrong or was regenerated. Re-copy it from the service's Settings -> Deploy Hook and update the RENDER_DEPLOY_HOOK_URL repository secret. See docs/deploy.md section 6.5."
                exit 1
                ;;
              404)
                echo "::error::Render has no such service, or no such commit (HTTP 404). Either the srv-<id> in the secret names a service that was deleted or re-created, or Render cannot see commit ${COMMIT_SHA} — check the service exists and that its connected repository is this one. See docs/deploy.md section 6.5."
                exit 1
                ;;
              409)
                echo "::error::Render will not accept a deploy for this service (HTTP 409): it is suspended, or the workspace is not permitted to deploy. On the free plan this is what exhausting the month's 750 instance hours looks like — service and hook both stay put, deploys just stop until the next month or a paid instance type. See docs/deploy.md section 6.5."
                exit 1
                ;;
              400|405)
                echo "::error::Render rejected the request itself (HTTP $status). That is this workflow sending something wrong — the ref or the method — not a problem with the secret. Body: $body"
                exit 1
                ;;
              *)
                if [ "$attempt" -lt 3 ]; then
                  echo "::warning::Render answered HTTP $status. Retrying in $((attempt * 15))s (attempt $attempt of 3). Body: $body"
                  sleep "$((attempt * 15))"
                  attempt=$((attempt + 1))
                  continue
                fi
                echo "::error::Render did not accept the deploy after 3 attempts; the last answer was HTTP $status. A 5xx (or 000, meaning the request never completed) is Render's side of the wire, not this repository's: nothing was deployed and whatever instance was live still is. Check https://status.render.com and the service's Events tab, then re-run this job. See docs/deploy.md section 6.5. Body: $body"
                exit 1
                ;;
            esac
          done

    # The frontend is not deployed from here. Vercel's Git integration builds and
    # ships it on push, which is one fewer long-lived token for this repo to hold.
