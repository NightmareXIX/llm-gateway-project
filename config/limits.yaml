# Free-tier rate limits per provider+model, with reset semantics.
#
# Nothing reads these for enforcement in Phase 1 — the quota tracker arrives in Phase 3.
# They are declared now because the reset semantics differ per provider and that
# difference is the whole reason `quota/windows.py` exists:
#
#   rolling_60s        — sliding window, the limit frees up continuously (Groq RPM/TPM)
#   fixed_daily_utc    — hard counter, resets at 00:00 UTC (Groq RPD/TPD)
#   fixed_daily_pt     — resets at midnight US/Pacific (Gemini's day boundary)
#
# `null` means the provider does not publish that window; the tracker must skip it
# rather than assume unlimited.

version: 1

limits:
  # These two replaced the retired Llama models in Aug 2026 — see the note in
  # config/providers.yaml for what that outage looked like. The numbers are read
  # off Groq's own `x-ratelimit-limit-*` headers on a live request rather than a
  # published table (`limit-requests: 1000`, `limit-tokens: 8000` for both), which
  # is the same source `QuotaTracker.apply_hint` corrects against at runtime. TPD
  # is the one window Groq publishes nowhere and does not header, so it stays a
  # conservative estimate that only ever errs toward failing over early.
  groq:
    openai/gpt-oss-120b:
      rpm: 30
      rpd: 1000
      tpm: 8000
      tpd: 200000
      reset:
        rpm: rolling_60s
        rpd: fixed_daily_utc
        tpm: rolling_60s
        tpd: fixed_daily_utc

    openai/gpt-oss-20b:
      rpm: 30
      rpd: 1000
      tpm: 8000
      tpd: 200000
      reset:
        rpm: rolling_60s
        rpd: fixed_daily_utc
        tpm: rolling_60s
        tpd: fixed_daily_utc

  # Gemini. Two things here are not like the others.
  #
  # `fixed_daily_pt` is the reason that enum exists: Google's RPD quota resets at
  # midnight *Pacific*, so for most of a UTC day the "resets at" a rolling-window
  # tracker would report is wrong by up to eight hours.
  #
  # And the budget is enforced per Google Cloud *project*, not per API key — a second
  # key in the same project adds nothing, and two of this gateway's environments
  # sharing a project share these numbers. Phase 3's `scope` is about *our* users,
  # not about that.
  #
  # Google no longer publishes a universal free-tier table; live quotas are visible
  # only in AI Studio's rate-limit page, per project. These are a documented snapshot
  # (Aug 2026), which §5's risk register already anticipates — one YAML file to edit,
  # never a hardcoded number.
  gemini:
    gemini-3.6-flash:
      rpm: 10
      rpd: 250
      tpm: 250000
      tpd: null
      reset:
        rpm: rolling_60s
        rpd: fixed_daily_pt
        tpm: rolling_60s

    gemini-3.5-flash-lite:
      rpm: 15
      rpd: 1000
      tpm: 250000
      tpd: null
      reset:
        rpm: rolling_60s
        rpd: fixed_daily_pt
        tpm: rolling_60s

    # Phase 6 Step 9 (D41): `pro`'s only candidate — a paid-tier model, never
    # reachable through the shared key, so these numbers describe a private
    # key's *own* budget with Google, not anything this gateway's shared pool
    # ever spends against. Read off AI Studio's paid-tier rate-limit page
    # (Aug 2026 snapshot), the same source and the same caveat as the two
    # free-tier Gemini entries above.
    gemini-3.6-pro:
      rpm: 60
      rpd: 1500
      tpm: 4000000
      tpd: null
      reset:
        rpm: rolling_60s
        rpd: fixed_daily_pt
        tpm: rolling_60s

  # OpenRouter publishes one limit for *all* `:free` models together — it is an
  # account-level allowance, not a per-model one, so these two blocks are the same
  # numbers describing a single shared budget. Phase 3's tracker will over-count here
  # by keying on (provider, model) like everywhere else; that errs toward failing over
  # early, which is the safe direction, and the alternative is a per-provider special
  # case in the one module that must stay provider-agnostic.
  #
  # 50 RPD is the no-credit tier. It becomes 1000 permanently once an account has ever
  # purchased $10 of credit — a one-time unlock, so if that ever happens, this is the
  # line to change. No published TPM: `null` means "no such window", which the tracker
  # must skip rather than read as unlimited.
  openrouter:
    nvidia/nemotron-3-super-120b-a12b:free:
      rpm: 20
      rpd: 50
      tpm: null
      tpd: null
      reset:
        rpm: rolling_60s
        rpd: fixed_daily_utc

    openai/gpt-oss-20b:free:
      rpm: 20
      rpd: 50
      tpm: null
      tpd: null
      reset:
        rpm: rolling_60s
        rpd: fixed_daily_utc

# D20: the gateway's own per-user limits, enforced independently of every
# provider table above. These have nothing to do with any provider's free
# tier — they protect the gateway's own capacity from one caller draining a
# shared pool for everyone else. Keyed by `users.tier`, whose CHECK constraint
# permits exactly `free` and `plus` (app/db/models.py).
gateway:
  free:
    rpm: 20
    rpd: 500
    # D39 (Phase 6 Step 7): a free-tier user's own slice of the *shared*
    # pool, per (provider, model) — separate from `rpd` above, which caps
    # calls to the gateway itself across every provider. A
    # `user_quota_allocations` row overrides this for one user; this is only
    # the default everyone else gets on the shared path.
    shared_pool_daily_cap: 50
  plus:
    rpm: 60
    rpd: 5000
    shared_pool_daily_cap: 200
