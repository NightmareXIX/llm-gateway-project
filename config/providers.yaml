# Slot table: logical slot -> ordered candidate list (provider + model + capabilities).
#
# The router walks a slot's candidates in order and fails over down the list (D1/D2).
#
# All three providers are live as of Phase 2 Step 6. Step 1 declared them in full —
# models, capabilities, limits (config/limits.yaml) and options — and left Gemini and
# OpenRouter `enabled: false` until their adapters existed, which is why Step 6 really
# was the config edit the design promised: two booleans here, two lines in
# `_PROVIDER_TRAITS`. The flag and that table cannot drift apart, because
# `registry._traits` refuses to build a registry for an enabled provider it has no
# adapter for — a mistake here is a boot failure, not a 502 mid-demo.
#
# Every slot below now has three candidates rather than one, so `auto` and every named
# slot fail over across genuinely different providers. Candidate order is the failover
# order, subject to the breaker and to D11's latency ranking.

version: 1

providers:
  groq:
    enabled: true
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY

  gemini:
    enabled: true
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GEMINI_API_KEY

  openrouter:
    enabled: true
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    # Attribution headers OpenRouter reads to credit traffic to an app. Not secrets,
    # and genuinely per-deployment, which is why they are config rather than constants
    # in the adapter. A fork pointing at its own deployment edits these two lines.
    options:
      HTTP-Referer: https://llm-gateway-sed.fly.dev
      X-Title: LLM Gateway

# Each candidate carries every per-model fact `ModelSpec` needs. `priority` is not
# a field — it is the candidate's index in the list below, so failover order and
# priority order cannot disagree. `supports_system_field` is not a field either:
# it is a property of the provider's wire format, and lives in registry.py.
#
# Order is the failover chain *and* D11's seed: `auto` flattens these lists in
# declaration order, then reorders by measured latency only where it has enough
# successful samples to justify it. A cold process serves exactly this order.
#
# Model IDs verified against each provider's live catalogue in August 2026. The free
# tiers rotate — OpenRouter's DeepSeek/Llama/Qwen free variants were all delisted
# between the project brief and this edit — so treat a 404 from one of these as news
# about the provider, not a bug in the router. The `:free` suffix on every OpenRouter
# model is load-bearing and asserted by a test: dropping it routes to the paid variant
# silently.
slots:
  general:
    description: Default answering slot — balanced quality and free-tier headroom.
    candidates:
      - provider: groq
        model: llama-3.3-70b-versatile
        context_tokens: 131072
        max_output_tokens: 32768
        capabilities: [text]
        supports_streaming: true
        max_file_bytes: null
        reserved_fraction: 0.0

      - provider: gemini
        model: gemini-3.6-flash
        context_tokens: 1048576
        max_output_tokens: 65536
        # The only candidate in the table that can see a file without the perception
        # lane extracting it first. Phase 4 is what reads these two flags.
        capabilities: [text, vision, pdf]
        supports_streaming: true
        max_file_bytes: 20000000
        # D8's 50/50 answer/perception split becomes 0.5 in Phase 3, when
        # quota/lanes.py is the thing that reads it. Zero until something does.
        reserved_fraction: 0.0

      - provider: openrouter
        model: nvidia/nemotron-3-super-120b-a12b:free
        context_tokens: 262144
        max_output_tokens: 262144
        capabilities: [text]
        supports_streaming: true
        max_file_bytes: null
        reserved_fraction: 0.0

  fast:
    description: Latency-first slot for short turns.
    candidates:
      - provider: groq
        model: llama-3.1-8b-instant
        context_tokens: 131072
        max_output_tokens: 8192
        capabilities: [text]
        supports_streaming: true
        max_file_bytes: null
        reserved_fraction: 0.0

      - provider: gemini
        model: gemini-3.5-flash-lite
        context_tokens: 1048576
        max_output_tokens: 65536
        capabilities: [text, vision, pdf]
        supports_streaming: true
        max_file_bytes: 20000000
        reserved_fraction: 0.0

      - provider: openrouter
        model: openai/gpt-oss-20b:free
        context_tokens: 131072
        max_output_tokens: 32768
        capabilities: [text]
        supports_streaming: true
        max_file_bytes: null
        reserved_fraction: 0.0

  # Perception lane (D8) and long-context slots land here in Phase 4/5.
  # Left undeclared rather than guessed — an empty candidate list is rejected at
  # load time, so no slot can exist without somewhere to actually route.
