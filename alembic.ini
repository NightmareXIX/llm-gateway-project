# Alembic configuration.
#
# `sqlalchemy.url` is deliberately absent. alembic/env.py reads DATABASE_URL through
# app/config.py, which is the single place this project resolves environment
# configuration — and passing the URL through this ini would run ConfigParser's
# %-interpolation over it, mangling percent-encoded passwords.

[alembic]
script_location = alembic
prepend_sys_path = .

# How prepend_sys_path is split. Without it alembic falls back to legacy splitting
# on spaces, commas *and colons* — which mangles a Windows path like C:\... — and
# warns on every run.
path_separator = os

# 0001_initial_schema.py — numeric prefixes keep `ls alembic/versions` in migration
# order, which a bare hash does not.
file_template = %%(rev)s_%%(slug)s

# No `timezone =` setting: alembic resolves it through zoneinfo, which on Windows
# needs the `tzdata` package installed. Not worth a dependency for a timestamp in
# a docstring header.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
